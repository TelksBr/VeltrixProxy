name: Build and Release Menu (Go)

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Menu Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Menu Binaries
        run: |
          mkdir -p dist
          MENU_VER="3.0.${{ github.run_number }}"
          echo "Compilando Menu versão ${MENU_VER}..."
          echo "${MENU_VER}" > dist/menu-version.txt
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X 'github.com/TelksBr/VeltrixProxy/internal/system.CurrentMenuVersion=${MENU_VER}'" -o dist/vt-linux-amd64 ./cmd/vt
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X 'github.com/TelksBr/VeltrixProxy/internal/system.CurrentMenuVersion=${MENU_VER}'" -o dist/vt-linux-arm64 ./cmd/vt
          cd dist
          sha256sum vt-linux-amd64 vt-linux-arm64 menu-version.txt > checksums-menu.txt
          ls -la

      - name: Publish Menu Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: menu-latest
          name: "VT CLI Manager v3.0.${{ github.run_number }} (menu-latest)"
          body: |
            ## VT CLI Manager v3.0.${{ github.run_number }} (Go Nativo)
            Binários compilados estaticamente para o menu interativo do VeltrixProxy.

            - **Versão:** v3.0.${{ github.run_number }}
            - **Arquiteturas suportadas:** linux-amd64, linux-arm64
            - **Atualização:** Automática via CI/CD a cada alteração em `main`.

            *Nota: Esta release é uma Pre-release fixa (não é a latest) e não interfere nos releases de versão do proxy.*
          prerelease: true
          draft: false
          make_latest: false
          files: |
            dist/vt-linux-amd64
            dist/vt-linux-arm64
            dist/menu-version.txt
            dist/checksums-menu.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
